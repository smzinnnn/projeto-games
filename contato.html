    <main>
        <section>
            <h2>Entre em Contato</h2>
            <p>Preencha o formulário abaixo e nos envie sua mensagem!</p>

            <form action="#" method="post">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                <label for="email">Seu E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="assunto">Assunto sobre os jogos:</label>
                <input type="text" id="assunto" name="assunto" placeholder="Qual o assunto?">

                <label for="mensagem">Sua Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>
