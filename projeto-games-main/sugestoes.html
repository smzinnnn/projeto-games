<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sugerir um Jogo</title>
</head>
<body>

    <h1>🎮 Sugira um Jogo</h1>

    <form>
        <label>Nome do jogo:</label><br>
        <input type="text" name="jogo" placeholder="Digite o nome"><br><br>

        <label>Por que recomenda?</label><br>
        <textarea name="motivo" rows="4" placeholder="Escreva aqui..."></textarea><br><br>

        <button type="submit">Enviar Sugestão ✅</button>
    </form>

</body>
</html>
